<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shinobi Wallet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 100%;
            text-align: center;
            border: 1px solid #334155;
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .balance-card {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .balance-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        .balance-amount {
            font-size: 2rem;
            font-weight: bold;
            margin-top: 5px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary {
            background-color: #38bdf8;
            color: #0f172a;
        }

        .btn-primary:hover {
            background-color: #7dd3fc;
        }

        .btn-secondary {
            background-color: #334155;
            color: #f8fafc;
        }

        .btn-secondary:hover {
            background-color: #475569;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">🥷💳</div>
        <h1>Shinobi Wallet</h1>
        <p>Byenveni nan pòtfèy dijital ou an. Sekirize, rapid, ak efikas.</p>

        <div class="balance-card">
            <div class="balance-label">Solde Aktyèl</div>
            <div class="balance-amount">$0.00 USD</div>
        </div>

        <div class="actions">
            <button class="btn-primary">Depoze</button>
            <button class="btn-secondary">Retire</button>
        </div>
    </div>

</body>
</html>
